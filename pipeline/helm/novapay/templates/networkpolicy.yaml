# NovaPay NetworkPolicy — Pod-to-Pod Network Restrictions
# Compliance: PCI-DSS v4.0 Requirement 1.2 (network segmentation)
# Compliance: RBI Section 5.4 (data-in-transit encryption)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "novapay.fullname" . }}
  labels:
    {{- include "novapay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "novapay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Istio ingress gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istio-ingressgateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Allow traffic from other NovaPay services in same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: novapay-digital-bank
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL access (shared database namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: novapay-shared
          podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis access (session management)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: novapay-shared
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow RabbitMQ access (async messaging)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: novapay-shared
          podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
# PodDisruptionBudget — Ensure minimum availability during node maintenance
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "novapay.fullname" . }}
  labels:
    {{- include "novapay.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "novapay.selectorLabels" . | nindent 6 }}
{{- end }}
