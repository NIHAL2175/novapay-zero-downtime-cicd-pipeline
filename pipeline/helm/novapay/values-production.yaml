# NovaPay Helm Values — Production Environment Override
# Purpose: Live customer-facing environment
# Data profile: Real production data
# Access: SRE + Release Manager only
# Deploy trigger: Dual approval (Release Manager + SRE Lead)

replicaCount: 3

image:
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  customMetrics:
    - name: http_requests_per_second
      targetValue: "500"
    - name: rabbitmq_queue_depth
      targetValue: "1000"

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 4000m
    memory: 4Gi

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: SERVER_SHUTDOWN
    value: "graceful"
  - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
    value: "60s"
  - name: JAVA_OPTS
    value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/novapay/heapdump.hprof"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://pgbouncer.novapay-shared:6432/novapay_production"
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: "50"
  - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
    value: "10"
  - name: SPRING_REDIS_HOST
    value: "redis-cluster.novapay-shared"
  - name: SPRING_REDIS_CLUSTER_NODES
    value: "redis-cluster-0:6379,redis-cluster-1:6379,redis-cluster-2:6379"
  - name: SPRING_RABBITMQ_HOST
    value: "rabbitmq-cluster.novapay-shared"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector.monitoring:4317"
  - name: OTEL_SERVICE_NAME
    value: "novapay-app-production"

ingress:
  enabled: true
  className: istio
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.novapay.com
      paths:
        - path: /api/
          pathType: Prefix
  tls:
    - secretName: novapay-prod-tls
      hosts:
        - api.novapay.com

virtualService:
  host: api.novapay.com
  gateway: novapay-prod-gateway

# Canary traffic split — adjusted during deployments
trafficSplit:
  stable: 100
  # canary: 0  # Set to 2, 5, 25, 50, 100 during progressive rollout

deploymentStrategy: canary

labels:
  app: novapay-app
  owner: sre-team
  complianceTier: critical

terminationGracePeriodSeconds: 90

podDisruptionBudget:
  enabled: true
  minAvailable: 2
